apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
        - name: calculator
          image: ghcr.io/spidynaughty/calculator_php_cicd:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: calculator
  namespace: default
spec:
  type: NodePort
  selector:
    app: calculator
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
