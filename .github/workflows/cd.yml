name: Calculator CD

on:
  workflow_run:
    workflows: ["Calculator CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to K3s
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/calculator \
            calculator=ghcr.io/spidynaughty/calculator_php_cicd:${{ github.event.workflow_run.head_sha }}
          kubectl rollout status deployment/calculator --timeout=180s
